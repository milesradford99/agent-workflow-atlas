# Simplified Chinese names and one-line summaries, shown on the site when the reader picks 中文.
# Keyed by workflow ID. Missing entries fall back to English. Steps and sources stay in English.

AWF-0001:
  name: "先审计划再开发"
  summary: "从议题出发，先出计划和失败测试再实现并提交 PR；计划、提交动作和最终评审都由人把关。"
AWF-0002:
  name: "批量代码迁移"
  summary: "对大量文件批量执行代码迁移并按负责人分批提 PR；试点后由人确定方案，抽检结果，代码负责人评审。"
AWF-0003:
  name: "委派式 PR 开发"
  summary: "将打好标签的议题实现为草稿 PR；CI 运行需人工批准，PR 由人评审并合并。"
AWF-0004:
  name: "先分诊后处置"
  summary: "对告警展开调查、给出带证据的假设排序并起草复盘；任何运行手册操作均由值班工程师批准。"
AWF-0005:
  name: "告警富化与研判"
  summary: "对安全告警做情报富化并给出带证据的结论；良性告警自动关闭，其余转二线，每周抽检自动关闭项。"
AWF-0006:
  name: "受治理的数据查询"
  summary: "基于受治理的指标口径生成 SQL 与图表来回答业务问题；分析师复核，发给高管前须签批。"
AWF-0007:
  name: "从用户反馈到原型"
  summary: "将用户反馈提炼为 PRD 并做出多个原型方案；产品经理选定要解决的问题，设计评审后再做用户测试。"
AWF-0008:
  name: "设计稿转代码"
  summary: "借助 Figma MCP，用已映射的组件和设计令牌把设计稿转成 UI 组件代码；设计师在预览版中评审。"
AWF-0009:
  name: "文献筛选漏斗"
  summary: "围绕 PICO 问题检索数据库，由两个独立筛选器初筛；人工审批方案、抽检、复核并签核。"
AWF-0010:
  name: "审稿意见回复与稿件修订"
  summary: "按审稿意见逐条修改稿件并起草回复信；作者审定修改方案、审改反驳并最终签发。"
AWF-0011:
  name: "设定集驱动的长篇小说"
  summary: "依据故事设定集逐场景起草长篇小说，并做连贯性和文风检查；作者批准计划并审阅。"
AWF-0012:
  name: "日更网文连载"
  summary: "依据细纲和人设每天写一章网文；每章经人工审阅，读者段评反馈到后续章节。"
AWF-0013:
  name: "从故事节拍到分场剧本"
  summary: "从一句话梗概经大纲、节拍到分场写出剧本，并生成评审意见；各计划与最终稿由人工批准。"
AWF-0014:
  name: "钩子节奏短剧剧本"
  summary: "按钩子和卡点节奏起草 60 至 100 集的短剧剧本；主笔改写开篇集和付费卡点集。"
AWF-0015:
  name: "AI 镜头工厂"
  summary: "把剧本逐镜头生成 AI 视频剧集；方案、成片审核和发布前签发均由人工把关。"
AWF-0016:
  name: "真人短剧 AI 辅助"
  summary: "辅助真人短剧的筹备与后期，并测试投流素材；计划、成片审核和发布前签发由人工完成。"
AWF-0017:
  name: "配音译制流水线"
  summary: "将剧集译制成多语种，含配音克隆、口型同步和字幕；母语质检抽样，人工签发。"
AWF-0018:
  name: "聚类简报成文内容"
  summary: "把关键词聚类成 SEO 文章简报，结合专家意见起草；选题计划和每篇文章发布前均由人工审核。"
AWF-0019:
  name: "广告变体矩阵"
  summary: "生成文案、静态图和数字人视频的广告变体矩阵并检查合规；方案和上传前均由人工审批。"
AWF-0020:
  name: "先调研再个性化外呼"
  summary: "建立目标名单，带来源调研账户并撰写个性化开场白；序列启动前由人工审核样本。"
AWF-0021:
  name: "流程型客服智能体"
  summary: "依据知识库和处理流程解决客户对话，交易限额写在代码里；敏感问题转人工，其余由质检抽样。"
AWF-0022:
  name: "发票提取、匹配与分流"
  summary: "提取发票字段，核查供应商与重复，三单匹配并编码；异常转人工，付款批次需签核。"
AWF-0023:
  name: "事件驱动的模型更新"
  summary: "依据新发布的财报和文件更新模型驱动项并逐格引用来源；分析师复核，合规签核后发布。"
AWF-0024:
  name: "依手册审阅合同"
  summary: "将各条款对照审查手册按红黄绿分级并加修订批注；律师审阅并签核后才发出。"
AWF-0025:
  name: "有据可查的法律备忘录"
  summary: "基于可靠法律数据库起草 IRAC 备忘录并逐条核实引用；律师批准计划并签核。"
AWF-0026:
  name: "诊室环境语音病历助手"
  summary: "经患者同意后录制就诊，生成关联转写稿的病历、编码和患者小结；医生审核签署。"
AWF-0027:
  name: "逆向设计课程开发"
  summary: "从课程标准出发依次生成目标、评估与课时材料；教师在各规划节点审批后再导入 LMS。"
AWF-0028:
  name: "锚点校准的自动评分"
  summary: "依据人工评分的锚点样本校准评分标准，附证据引文；低置信度评分由人工抽检并签核。"
AWF-0029:
  name: "寻访筛选排期招聘"
  summary: "寻访候选人、整理个人证据摘要、安排面试并准备面试材料；智能体不做淘汰决定，由人定夺。"
AWF-0030:
  name: "议题树研究"
  summary: "基于 MECE 议题树做研究，附带来源的论点表并生成报告；计划和成稿前由人工审核。"
AWF-0031:
  name: "每日收件箱分流"
  summary: "每天早晨整理邮件、日程和私信，生成回复草稿、时段建议和重点简报；所有消息由本人发送。"
AWF-0032:
  name: "按标准把关的预授权申请"
  summary: "对照支付方标准核查病历，起草文件清单和申请信；工作人员修改并提交申请或申诉。"
AWF-0033:
  name: "协调员复核的试验预筛选"
  summary: "按患者逐条标注入排标准并附依据和出处，再排序；研究协调员逐条裁定。"
AWF-0034:
  name: "化学家把关的 DMTA 循环"
  summary: "生成并排序候选化合物，编写高通量实验方案；化学家筛选、修正流程并在台架规模复现。"
AWF-0035:
  name: "经验证的生成式初审"
  summary: "律师在样本上调试审阅提示词后全量运行，并验证精确率与漏检率；责任律师签核。"
AWF-0036:
  name: "合规义务清单构建"
  summary: "抓取法规并整理成结构化的义务与控制措施清单；律师核查输出并确认充分性。"
AWF-0037:
  name: "数据室红旗风险审查"
  summary: "对照审查手册逐份审阅数据室文件并附引用，标出红旗风险；律师核实并分类。"
AWF-0038:
  name: "对照底稿的月结智能体"
  summary: "参照上月底稿准备月结底稿、草拟分录与波动分析；财务主管全面复核并签核关账。"
AWF-0039:
  name: "预算差异说明初稿"
  summary: "基于计划数据按公司口吻起草预算与实际差异说明；财务团队修改后才提交管理层。"
AWF-0040:
  name: "全量控制测试"
  summary: "对全部样本逐项测试内部控制，结论附来源引用；审计师复核每项结论和例外。"
AWF-0041:
  name: "可供复核的 1040 报税准备"
  summary: "从客户资料提取字段，生成底稿并导入报税软件；经办人核验，高级复核人签字报送。"
AWF-0042:
  name: "导师确认的 AI 辅导回复"
  summary: "学生答错时起草辅导回复；值班导师逐条批准、修改或替换后才发送。"
AWF-0043:
  name: "专家资料转电子课程"
  summary: "把领域专家的资料转为大纲和在线课程；教学设计师与专家审核后才发布。"
AWF-0044:
  name: "分步把关的复现实验"
  summary: "获取复现包、运行代码并将系数与论文比对；研究者批准计划并复核差异。"
AWF-0045:
  name: "先评后改的基金申请书"
  summary: "起草申请书并模拟评审组批评但不改写；仅采纳课题负责人接受的意见，由其最终签核。"
AWF-0046:
  name: "评审意见的再评审反馈"
  summary: "检查评审意见中的含糊、误读等问题并私下反馈；评审人可采纳、修改或忽略。"
AWF-0047:
  name: "校准式对话质检评分"
  summary: "用分项分类器给客服对话打分并按根因聚类失败案例；人工抽样审核并复核聚类结果。"
AWF-0048:
  name: "缺口匹配知识库维护"
  summary: "把已解决工单归类，判断新建、更新或跳过并起草知识库文章；编辑或专家审核，产品负责人签发。"
AWF-0049:
  name: "续约窗口风险简报"
  summary: "扫描临近续约的客户，生成带证据的风险简报和挽留计划；CSM 核实风险标记并批准外联。"
AWF-0050:
  name: "通话转 CRM 差异审批"
  summary: "把销售通话整理成 CRM 字段变更建议和跟进邮件草稿；销售批准变更并亲自发送邮件。"
AWF-0051:
  name: "受控题库的 RFP 应答草稿"
  summary: "基于已验证的资料库起草 RFP 答复并附来源；专家或合规人员审核标记项，最后由人签发。"
AWF-0052:
  name: "提议确认式管道巡检"
  summary: "每天巡检 CRM 销售管道中过期或缺失的下一步并发布异常视图；回写数据前由人工确认。"
AWF-0053:
  name: "计划转日历的社媒排期"
  summary: "按渠道起草社媒帖子并排入发布日历；计划、每条内容审核及发布均需人工批准。"
AWF-0054:
  name: "带护栏的营销活动搭建"
  summary: "生成邮件旅程、人群规格、UTM 登记和模板 HTML；方案由人工批准，导出到 ESP 前需人工复核。"
AWF-0055:
  name: "分发式竞品周报"
  summary: "汇总销售和竞品动态生成每周竞品简报并分派给负责人；CI 负责人审核，PMM 更新竞争卡片。"
AWF-0056:
  name: "分阶段预览的 CAD 建模"
  summary: "分三个阶段生成带预览的参数化 CAD 模型；每阶段的预览和切片结果都由制作者确认后再打印。"
AWF-0057:
  name: "工程师把关的 CFD 仿真"
  summary: "根据需求说明搭建并运行 OpenFOAM 流体仿真，输出验证报告；工程师审核假设和物理结果。"
AWF-0058:
  name: "带条文引用的预审检查"
  summary: "对上传的图纸按预设规范逐项检查并引用条文；市政审查员对每项结果判定通过或需整改。"
AWF-0059:
  name: "图纸生成工艺路线草案"
  summary: "根据 BOM 和图纸生成含工位与工时的工艺路线草案；班组长调整后下发生产。"
AWF-0060:
  name: "从需求文档到工单规划"
  summary: "把需求文档拆解成工单项目计划并录入任务系统；拆解方案由人反复修改，产品和研发共同评审工单。"
AWF-0061:
  name: "原话核验的研究综合"
  summary: "基于检索到的原话和主题起草研究洞察报告；研究员对照原始记录核验每条引用并签批。"
AWF-0062:
  name: "依据规格的界面方案"
  summary: "依据工单及关联资料生成灰度线框方案和高保真 Figma 界面；设计师选定方案并检查成品。"
AWF-0063:
  name: "差异验证的 dbt 迁移"
  summary: "将遗留代码迁移为 dbt 项目，每个模型都与生产数据比对验证；数据负责人逐表审批并签批切换。"
AWF-0064:
  name: "基于代码库的数据分析"
  summary: "依托团队代码库和已验证数据表起草分析备忘录；未验证的表须分析师确认，草稿由其核实。"
AWF-0065:
  name: "通宵实验迭代"
  summary: "通宵循环修改代码、训练和评估，产出改进的候选模型；协议由人制定，晋级前由科学家审查日志。"
AWF-0066:
  name: "对话驱动的 IaC 变更"
  summary: "把 Slack 请求或告警转成附带 plan 结果的基础设施即代码 PR；CODEOWNERS 审批人通过后合并才会生效。"
AWF-0067:
  name: "Sanitizer 漏洞自动修复"
  summary: "为 Sanitizer 发现的缺陷生成并测试修复提交；安全工程师筛选，代码所有者验证后提交。"
AWF-0068:
  name: "Slack IT 请求助手"
  summary: "在 Slack 中处理 IT 使用咨询与权限申请；权限开通须指定审批人批准，无法处理的转为工单交人工。"
AWF-0069:
  name: "筛选式测试补充"
  summary: "为已有测试类生成补充单测，只保留通过多重过滤的，以 diff 提交；代码负责人逐个决定采纳与否。"
AWF-0070:
  name: "分级打分的 PR 评论"
  summary: "在代码变更上发布带置信度分级的评审评论；作者将每条标记为有用或无用，并决定是否处理。"
AWF-0071:
  name: "先复现再修复的缺陷处理"
  summary: "先复现缺陷，再提交修复 PR 和回归测试 PR；无法复现的转人工，合并前由工程师评审。"
AWF-0072:
  name: "带护栏的设计方案"
  summary: "根据概念文档生成并对照护栏文件检查的设计方案；工程师评审，法务、隐私和安全团队签批。"
AWF-0073:
  name: "资料卷宗成书"
  summary: "逐章起草带引注的非虚构书稿；作者审核每章简报、资料卷宗和成稿，并做最终决定。"
AWF-0074:
  name: "记者笔记改写台"
  summary: "根据记者笔记起草新闻稿；改写编辑审核，记者终读后发布。"
AWF-0075:
  name: "代码 PR 文档草稿"
  summary: "根据代码 PR 起草文档 PR；代码作者核对准确性，文档团队审查文风后合并。"
AWF-0076:
  name: "术语库支撑的网文机翻后编"
  summary: "借助类型术语库对新网文章节机器翻译；人工校对逐章后编辑，再发布到海外平台。"
AWF-0077:
  name: "先文稿后剪辑的视频制作"
  summary: "基于文字稿剪辑录制视频并生成字幕和叠层；作者审核剪辑和预览，通看后签发。"
AWF-0078:
  name: "播客单集后期流程"
  summary: "剪辑并为录制好的播客添加字幕，起草配套素材；字幕、整期试听和素材发布前均由人工审核。"
AWF-0079:
  name: "概念图驱动的 SD 美术资产"
  summary: "基于美术概念图，用定制训练的图像模型生成游戏美术资产；美术师逐项调整并批准。"
AWF-0080:
  name: "意见征询主题分析与签核"
  summary: "从征询意见中归纳主题并归类每条回复；政策团队确认主题清单，分析师核验归类结果。"
AWF-0081:
  name: "摘要辅助的个案决定"
  summary: "整理面谈记录摘要并检索政策依据；决策者核对摘要，亲自作出并签署决定。"
AWF-0082:
  name: "模型分流的记录公开审查"
  summary: "用训练好的模型对记录判定解密或豁免；存疑记录由人工复核，模型判断经抽检后才公开。"
AWF-0083:
  name: "限额内的长尾采购谈判"
  summary: "在采购员设定的限额内与供应商谈判长尾采购条款；超出限额转采购员，达成的条款写入 ERP。"
AWF-0084:
  name: "数据驱动的项目状态报告"
  summary: "从项目数据生成含风险提示和甘特图的状态报告；项目经理修改后再发送。"
AWF-0085:
  name: "按政策审核报销"
  summary: "对照差旅费用政策审核报销单；合规的交经理签批，违规的转 T&E 专员，并向员工反馈。"
AWF-0086:
  name: "模板驱动的会议纪要"
  summary: "转写带说话人标记的会议录音，按所选模板生成纪要；经负责人修改后再分发。"
AWF-0087:
  name: "差异审阅式笔记库维护"
  summary: "智能体按口述指令整理笔记库、同步转写稿；每次提交前由本人审阅 git 差异。"
AWF-0088:
  name: "放射片报告预生成"
  summary: "影像完成后在听写系统中预生成报告草稿；放射科医生像审阅实习医生草稿一样核对修改。"
AWF-0089:
  name: "分类路由的患者消息回复草稿"
  summary: "对患者消息分类，并在 EHR 收件箱中生成回复草稿；医生修改并亲自发送每一条。"
AWF-0090:
  name: "按例外分流的自动编码"
  summary: "为每份病历自动分配 ICD/CPT 编码并附理由；低置信或冲突病历转编码员，其余定期抽审。"
AWF-0091:
  name: "撰写人复核的临床研究报告初稿"
  summary: "基于临床数据表生成临床研究报告初稿；由具资质的医学撰写人全面审阅。"
AWF-0092:
  name: "业务自助合同起草"
  summary: "业务人员填写引导表单，由智能体套用法务批准的模板起草；超出范围的交法务加急审核。"
AWF-0093:
  name: "校准后的特权日志"
  summary: "先在样本上生成特权日志描述，依据外部律师反馈调整提示词，再用于全部文件。"
AWF-0094:
  name: "多智能体理赔档案"
  summary: "多个专职智能体核查保障、天气与欺诈并提出赔付建议；理赔专业人员据审计摘要决定是否付款。"
AWF-0095:
  name: "理赔员确认的发票处理建议"
  summary: "对宠物医疗发票逐行建议赔付或除外；理赔员接受、修改或转人工处理。"
AWF-0096:
  name: "基于保单条款的理赔函件"
  summary: "起草引用保单条款的理赔函件，无依据条款时拦截；由理赔员复核，保险公司批准后发出。"
AWF-0097:
  name: "引用政策条款的费用审核"
  summary: "对照费用政策逐笔审核并附条款引用，低风险自动通过；异常交审批人，政策调整由财务决定。"
AWF-0098:
  name: "承销人定稿的信贷备忘录"
  summary: "提取交易文件信息并逐节起草信贷备忘录；承销人定稿，并经银行信贷审批流程签核。"
AWF-0099:
  name: "数据支持的 IEP 草案"
  summary: "提取学生数据填入 IEP 模板，未知内容留空；由特教教师确定目标，IEP 团队签核。"
AWF-0100:
  name: "分段确认的课程备课"
  summary: "基于所选范例课逐段起草教案、课件和测验；每一段均由教师确认或修改。"
AWF-0101:
  name: "生成式题库"
  summary: "生成阅读材料及带干扰项的试题并自动过滤；内容与公平性审题员批准后才进入试测。"
AWF-0102:
  name: "有护栏的课程辅导助手"
  summary: "课程辅导助手只给引导而非答案；教师可认可、修改或删除论坛回答，并抽检提示词更新。"
AWF-0103:
  name: "AI 角色扮演练习"
  summary: "学员与 AI 客户进行语音角色扮演，场景取自真实对话；培训师审批场景并现场辅导。"
AWF-0104:
  name: "假设锦标赛"
  summary: "多个智能体生成、辩论并以锦标赛方式排序研究假设；科学家设定目标、评估并经实验验证。"
AWF-0105:
  name: "资助方一侧的申请预筛选"
  summary: "三个分类器标出可能垫底的申请；每份由两名资格审查员确认剔除或放回同行评审。"
AWF-0106:
  name: "投稿入口筛查"
  summary: "筛查投稿的抄袭、图像完整性、利益冲突和论文工厂迹象；被标记的稿件由编辑决定是否送审。"
AWF-0107:
  name: "人工发送的回复起草"
  summary: "结合案件历史、CRM 和知识库起草客户回复；每条回复都由客服顾问修改并发送。"
AWF-0108:
  name: "住户报修分诊派单"
  summary: "对住户报修进行分诊，生成带优先级的工单并派给技师或承包商；紧急情况转交值班人员。"
AWF-0109:
  name: "入站线索资格审核与约会"
  summary: "实时对话筛选入站销售线索并预约会议；人工每天复核所有对话，会议由销售负责。"
AWF-0110:
  name: "仅处理异常的合同校验"
  summary: "对照报价核验已签合同，无误的写入 CRM；存疑的合同交由交易支持专员处理。"
AWF-0111:
  name: "商品文案工厂"
  summary: "依据商品数据和文案规则按 SKU 起草详情文案；经规则检查和人工筛查队列审核后批量发布。"
AWF-0112:
  name: "置信度抽检的属性抽取"
  summary: "抽取商品属性值并给出置信度；审核员只修正低置信度条目，并定期抽样检查质量漂移。"
AWF-0113:
  name: "副驾式属性建议"
  summary: "在新品上架时建议商品属性值；内容专家逐项接受或修改后才发布。"
AWF-0114:
  name: "供应商确认的商品纠错"
  summary: "对照标注指南修正商品信息；高置信度改动直接更新，高风险项需供应商确认，并由员工抽检。"
AWF-0115:
  name: "分级授权广告优化"
  summary: "分析广告账户数据并按权限分级调整；低风险操作自动执行，预算和结构调整需人工批准。"
AWF-0116:
  name: "智能体辅助的 PCB 原理图"
  summary: "根据手绘草图生成 KiCad 原理图和投板资料；设计师确认方案及每一步，另一位工程师评审原理图。"
AWF-0117:
  name: "报建前图纸预检"
  summary: "在提交前对报建图纸集生成按专业和严重程度排序的问题清单；设计公司甄别真伪问题。"
AWF-0118:
  name: "分区规划合规研究小组"
  summary: "对照当地规划条文核查项目并起草规划合规研究；建筑师审核签字后才用于报建申请。"
AWF-0119:
  name: "AI 优先的 CAM 编程"
  summary: "在 CAM 中自动生成数控加工工序、刀路及切削参数；编程员逐个调整程序，员工检验首件。"
AWF-0120:
  name: "智能体执行的用户访谈"
  summary: "自适应地开展用户研究访谈，归纳主题并附原话；研究员定稿访谈方案，发布前审核结论。"
AWF-0121:
  name: "分流式无障碍 PR 助手"
  summary: "审查前端 PR 的无障碍问题并给出修复建议，复杂情况转交无障碍团队；是否采纳每项建议由人决定。"
AWF-0122:
  name: "打分式设计令牌迁移"
  summary: "用打分匹配把代码库迁移到新的设计令牌；试点阶段由研发和 UX 共同审查，最后人工逐屏点检。"
AWF-0123:
  name: "定时指标解读"
  summary: "按计划发布指标与 OKR 变动的解读报告并通知分析负责人，由其在发布后审阅修改。"
AWF-0124:
  name: "按需召唤的 dbt 排障助手"
  summary: "工程师在 Slack 中召唤后诊断 dbt 生产故障；是否修复由工程师决定，修复 PR 由其审核合并。"
AWF-0125:
  name: "多智能体实验报告评审"
  summary: "由统计、数据工程、业务分析三类智能体对实验报告给出结构化评审意见；独立数据科学家复核后再决定是否上线。"
AWF-0126:
  name: "校准评审的质量闭环"
  summary: "用经人工校准的评审器给线上智能体会话打分并为失败类别起草修复；评分细则、标注和修复审核均由人负责。"
AWF-0127:
  name: "网络故障根因分析（NOC）"
  summary: "分析网络告警，在故障工单中标注根因和建议措施；NOC 工程师采纳或修改，复杂问题升级至二线。"
AWF-0128:
  name: "攻击模拟验证检测规则"
  summary: "在实验室编写并执行攻击模拟，验证检测规则能否告警；每个 TTP 入库前都由人工审核。"
AWF-0129:
  name: "AI 模糊测试目标挖掘"
  summary: "自动编写并运行模糊测试目标，将崩溃分类整理成漏洞报告；分类由人确认，确认的漏洞交维护者修复。"
AWF-0130:
  name: "基于性能剖析的优化"
  summary: "依据线上性能剖析定位热点函数中的反模式，给出带置信度的修复建议；开发者评审后才合并。"
AWF-0131:
  name: "变异体驱动的加固测试"
  summary: "针对隐私等指定关注点，借助变异体生成能捕获缺陷的测试；工程师逐个评审并决定采纳。"
AWF-0132:
  name: "连跑验证的不稳定测试修复"
  summary: "修复不稳定测试，连续多次重跑均通过后才提交 PR；合并前由人工评审。"
AWF-0133:
  name: "评论转修改建议"
  summary: "根据评审意见生成代码修改建议；作者预览后自行决定是否采纳。"
AWF-0134:
  name: "抽样核验的 LLM 文件分析"
  summary: "用结构化 LLM 查询分析大批文件以支撑数据报道；AI 委员会批准使用，记者对抽样结果双重核对。"
AWF-0135:
  name: "发版周期文档技能"
  summary: "每次发版重新生成 API 参考并起草发布说明，附自动核查；撰稿人审核后发布。"
AWF-0136:
  name: "术语把关的游戏本地化"
  summary: "按文本类型结合术语检索和规则检查翻译游戏文本；语言专家确认术语，交付前由 LQA 专家检查。"
AWF-0137:
  name: "分关把控的 AI 漫剧产线"
  summary: "从立项评审到剧本、数字资产、分镜和镜头生成的 AI 漫剧产线；各阶段均有人工评审。"
AWF-0138:
  name: "自动直播战报"
  summary: "从直播比赛流中识别关键时刻并自动发布精彩回顾，无需逐条审批；团队抽样监控输出。"
AWF-0139:
  name: "导演式 AI 有声书"
  summary: "用 AI 配音制作有声书母带；真人确认选角试听、审听全书，作者最终签发。"
AWF-0140:
  name: "图生 3D 资产包"
  summary: "由概念图生成可入引擎的 3D 资产包；美术师筛选生成结果，并完成拓扑、UV 和外观收尾。"
AWF-0141:
  name: "缺口核查的福利表单填写"
  summary: "先做缺口分析，再依据机构记录填写福利申请表；个案工作者逐项修正确认后提交。"
AWF-0142:
  name: "上门走访录音生成照护评估"
  summary: "录制并转写照护走访或通话，起草评估或个案记录；从业人员审核修改后再归档。"
AWF-0143:
  name: "规划档案数据提取与人工核验"
  summary: "从扫描的规划档案中提取字段与地图边界；规划官员逐项核对后才导出至国家平台。"
AWF-0144:
  name: "经理批准的招聘流程操作"
  summary: "对应聘者分级并给出处理建议；经理批准整批操作后，再发送消息并归档候选人。"
AWF-0145:
  name: "日历时间审计"
  summary: "审查近两周日历，提出可取消或转交的会议；本人逐项取舍，由助理执行日历变更。"
AWF-0146:
  name: "先选后读的文献摘要简报"
  summary: "每日检索 arXiv 和 Scholar 生成简报，再对读者勾选的论文做摘要；由读者核对摘要。"
AWF-0147:
  name: "分析师核验的租约摘要"
  summary: "将租约及修订条款提取为带出处的数据字段；分析师对照原文核对并裁定需判断的字段。"
AWF-0148:
  name: "报关单预录与经纪人复核"
  summary: "根据进口商单据预录报关单，每个字段附置信度和出处；录入员复核，报关经纪人最终确认申报。"
AWF-0149:
  name: "可决策的投保件分诊"
  summary: "把经纪人投保件数字化并打分，排入核保队列；低置信度的由人工复核，核保员最终决定。"
AWF-0150:
  name: "邮件转货运订单"
  summary: "把客户邮件转成货运报价、订单和预约；异常交由经理处理，并对邮件分类做人工抽检。"
AWF-0151:
  name: "施工提交件初审"
  summary: "将施工提交件与规格书及既往批复比对并给出处理建议；项目经理或工程师复核，最终由审批责任人批准。"
AWF-0152:
  name: "分层智能体安全审核"
  summary: "用文档、任务、报告三层智能体整理现场安全资料并生成审核报告；由人工审查全过程。"
AWF-0153:
  name: "漏提货电话处置"
  summary: "就零担漏提货致电承运商并决定后续动作；无法解决的移交零担团队处理。"
AWF-0154:
  name: "地块登记式农艺建议"
  summary: "为农户登记的地块生成养分方案和生长季建议；农户核对地块边界，带头农户或技术员协助落实。"
AWF-0155:
  name: "核保员复核的经纪人报价"
  summary: "为范围内的续保起草含定价的经纪人报价邮件；发送前由核保员审核。"
