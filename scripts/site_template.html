<style>

    covShort: {Strong: "充分", Partial: "部分", Weak: "薄弱", "None found": "暂无"},

const COV = ["Strong", "Partial", "Weak", "None found"];
let lang = (() => {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && STR[q]) return q;
  try { const s = localStorage.getItem("awa-lang"); if (s && STR[s]) return s; } catch (e) {}
  return /^zh/i.test(navigator.language || "") ? "zh-CN" : "en";

const T = () => STR[lang];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));

const nameOf = w => lang === "zh-CN" && w.nameZh ? w.nameZh : w.name;

const stopsOf = w => w.route.filter(m => m.k === "stop").length;

  {key: "kingdom", values: Object.keys(DATA.taxonomy), label: v => lab("kingdoms", v)},

  {key: "evidence", values: ["A", "B", "C"], label: v => T().ev[v]},
  {key: "risk", values: ["low", "medium", "high"], label: v => T().risk[v]},
  {key: "status", values: ["accepted", "draft"], label: v => T().status[v]},
  {key: "region", values: [...new Set(W.flatMap(w => w.region))].sort(), label: v => v},
];
const state = {q: "", view: "start", f: Object.fromEntries(GROUPS.map(g => [g.key, new Set()])), open: {kingdom: true, coverage: true, checkpoints: true}};
const HAY = Object.fromEntries(W.map(w => [w.id, [w.id, w.name, w.nameZh, w.summary, w.summaryZh,
  L.phyla[w.phylum]?.en, L.phyla[w.phylum]?.["zh-CN"], L.classes[w.class]?.en, L.classes[w.class]?.["zh-CN"], w.class,
  w.deliverable, w.shape, w.variants.join(" "), w.steps].join(" ").toLowerCase()]));

function matches(w, skip) {
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.some(t => !HAY[w.id].includes(t))) return false;
  for (const g of GROUPS) {
    if (g.key === skip || !state.f[g.key].size) continue;
    const sel = state.f[g.key], val = w[g.key];
    if (Array.isArray(val) ? (g.all ? ![...sel].every(v => val.includes(v)) : !val.some(v => sel.has(v))) : !sel.has(val)) return false;
  }
  return true;
}

function routeHTML(w, big) {
  const t = T(), label = m => m.k === "stop" ? "🛑 " + t.cp[m.cp] : m.t;
  return `<div class="route${big ? " big" : ""}" role="img" aria-label="${esc(w.route.map(label).join(" → "))}">${w.route.map(m =>
    `<span class="m ${m.k}" title="${esc(m.k === "stop" && m.t && m.t !== m.cp ? label(m) + ": " + m.t : label(m))}"><i></i></span>`).join("")}</div>`;
}
function card(w) {
  const t = T();
  return `<button class="card" data-id="${w.id}">
    ${routeHTML(w)}
    <h3>${esc(nameOf(w))}</h3>
    <div class="sub">${esc(lab("phyla", w.phylum))}, ${esc(lab("classes", w.class))}</div>
    <p class="sum">${esc(sumOf(w))}</p>
    <div class="facts"><span class="grade ${gc(w.coverage)}">${esc(t.cov[w.coverage] || "")}</span><span class="stop-text">${t.stops(stopsOf(w))}</span>${w.kit ? `<span class="kit-tag">${t.kit}</span>` : ""}</div>
  </button>`;
}
function renderStart(list) {
  const t = T(), kits = list.filter(w => w.kit);
  const best = list.filter(w => w.coverage === "Strong" && w.evidence === "A" && !w.kit).sort((a, b) => (b.runs - a.runs) || a.id.localeCompare(b.id));
  let out = "";
  if (kits.length) out += `<section class="sec"><h2>${t.startKits}</h2><p>${t.startKitsText(kits.length)}</p><div class="cards">${kits.map(card).join("")}</div></section>`;
  if (best.length) out += `<section class="sec"><h2>${t.startBest}</h2><p>${t.startBestText(best.length)}</p><div class="cards">${best.map(card).join("")}</div></section>`;
  return out || empty();
}
function wfLink(w) {
  return `<button class="wf-link" data-id="${w.id}"><span class="dot ${gc(w.coverage)}" title="${esc(T().cov[w.coverage] || "")}"></span><span class="nm">${esc(nameOf(w))}</span>${routeHTML(w)}</button>`;
}
function renderMap(list) {
  let out = "";
  for (const [k, kd] of Object.entries(DATA.taxonomy)) {
    const inK = list.filter(w => w.kingdom === k && !w.unplaced);
    if (!inK.length) continue;
    out += `<div class="kingdom"><h2>${esc(lab("kingdoms", k))}</h2><span>${T().count(inK.length, inK.length)}</span></div>`;
    for (const [p, pd] of Object.entries(kd.phyla)) {
      const inP = inK.filter(w => w.phylum === p);
      if (!inP.length) continue;
      out += `<div class="phylum"><h3>${esc(lab("phyla", p))}<span>${inP.length}</span></h3>` + pd.classes.map(c => {
        const ws = inP.filter(w => w.class === c);
        return ws.length ? `<div class="cls"><div class="cls-name">${esc(lab("classes", c))}</div>${ws.map(wfLink).join("")}</div>` : "";
      }).join("") + `</div>`;
    }
  }
  const un = list.filter(w => w.unplaced);
  if (un.length) out += `<div class="kingdom"><h2>${T().unplaced}</h2><span>${esc(T().unplacedText)}</span></div><div class="phylum">${un.map(wfLink).join("")}</div>`;
  return out ? `<div class="atlas">${out}</div>` : empty();
}
function renderList(list) {
  const t = T();
  return list.length ? `<div class="rows">${list.map(w => `<button class="row" data-id="${w.id}">
    <div><div class="t">${esc(nameOf(w))}</div><div class="s">${esc(sumOf(w))}</div></div>
    <div class="p">${esc(lab("phyla", w.phylum))}<br>${esc(lab("classes", w.class))}</div>
    <div class="r">${routeHTML(w)}</div>
    <div><span class="grade ${gc(w.coverage)}">${esc(t.covShort[w.coverage] || "")}</span></div>
  </button>`).join("")}</div>` : empty();
}
function empty() { return `<div class="empty"><p>${T().empty}</p><button class="btn" data-clear>${T().clear}</button></div>`; }

function renderFilters() {
  const t = T();
  document.getElementById("filters").innerHTML = GROUPS.filter(g => g.values.length).map(g => {
    const rows = g.values.map(v => {
      const n = W.filter(w => matches(w, g.key) && (Array.isArray(w[g.key]) ? w[g.key].includes(v) : w[g.key] === v)).length;
      const on = state.f[g.key].has(v);
      return `<label class="${n || on ? "" : "zero"}"><input type="checkbox" data-g="${g.key}" value="${esc(v)}" ${on ? "checked" : ""}><span>${esc(g.label(v))}</span><span class="n">${n}</span></label>`;
    }).join("");
    return `<details data-g="${g.key}" ${state.open[g.key] || state.f[g.key].size ? "open" : ""}><summary>${t.groups[g.key]}</summary>${g.all ? `<div class="hint">${t.hintAll}</div>` : ""}${rows}</details>`;
  }).join("") + `<button class="btn clear" data-clear>${t.clear}</button>`;
}

function render() {
  const t = T(), list = W.filter(w => matches(w));
  document.documentElement.lang = lang;
  document.title = lang === "zh-CN" ? "Agent Workflow Atlas · AI 智能体工作流图谱" : "Agent Workflow Atlas";
  document.getElementById("q").placeholder = t.search;
  document.getElementById("q").setAttribute("aria-label", t.search);
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const professions = Object.values(DATA.taxonomy).reduce((n, k) => n + Object.keys(k.phyla).length, 0);
  const sample = {route: [{k: "step", t: ""}, {k: "loop", t: ""}, {k: "step", t: ""}, {k: "stop", t: "", cp: "plan"}, {k: "each", t: ""}, {k: "step", t: ""}, {k: "stop", t: "", cp: "review"}]};
  document.getElementById("hero").innerHTML = `<div><h1>${t.heroTitle}</h1><p>${t.heroText({w: W.length, p: professions})}</p></div>
    <div class="legend"><strong>${t.legendTitle}</strong>${routeHTML(sample, true)}
    <dl><dt class="route"><span class="m step"><i></i></span></dt><dd>${t.lStep}</dd><dt class="route"><span class="m loop"><i></i></span></dt><dd>${t.lLoop}</dd><dt class="route"><span class="m each"><i></i></span></dt><dd>${t.lEach}</dd><dt class="route"><span class="m stop"><i></i></span></dt><dd>${t.lStop}</dd></dl></div>`;
  document.getElementById("hero").style.display = state.view === "start" && !state.q ? "" : "none";
  document.getElementById("tabs").innerHTML = ["start", "map", "list"].map(v => `<button role="tab" data-view="${v}" aria-selected="${state.view === v}">${t.tabs[v]}</button>`).join("");
  document.getElementById("count").textContent = t.count(list.length, W.length);
  document.getElementById("filters-toggle").textContent = t.filters;
  document.getElementById("view").innerHTML = state.view === "map" ? renderMap(list) : state.view === "list" ? renderList(list) : renderStart(list);
  renderFilters();
  document.getElementById("foot").innerHTML = `<span>${t.foot.data}: <a href="catalog.json">${t.foot.json}</a>, <a href="catalog.csv">${t.foot.csv}</a></span>${DATA.repo ? `<a href="${DATA.repo}">${t.foot.repo}</a><a href="${DATA.repo}/blob/main/CONTRIBUTING.md">${t.foot.contribute}</a>` : ""}<span>${t.foot.license}</span>`;
}

function inline(s, base) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
  s = s.replace(/\[\[(\d+)\]\]\(#sources\)/g, '<sup><a href="#src-$1">[$1]</a></sup>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, x, u) => `<a href="${/^(https?:|#)/.test(u) ? u : linkTo(base, u)}" target="_blank" rel="noopener">${x}</a>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(^|[\s(])\*([^*]+)\*/g, "$1<em>$2</em>");
  return s.replace(/(https?:\/\/[^\s<)]+)(?![^<]*>|[^<>]*<\/a>)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
}
function md(text, base, srcAnchors) {
  const out = []; let list = null;
  for (const raw of text.split("\n")) {
    const line = raw.trimEnd(), ol = line.match(/^(\d+)\.\s+(.*)$/), ul = line.match(/^[-*]\s+(.*)$/);
    if (ol || ul) {
      const tag = ol ? "ol" : "ul";
      if (list !== tag) { if (list) out.push(`</${list}>`); out.push(`<${tag}>`); list = tag; }
      out.push(`<li${ol ? ` value="${ol[1]}"${srcAnchors ? ` id="src-${ol[1]}"` : ""}` : ""}>${inline(ol ? ol[2] : ul[1], base)}</li>`);
      continue;
    }
    if (list) { out.push(`</${list}>`); list = null; }
    if (line.trim()) out.push(`<p>${inline(line, base)}</p>`);
  }
  if (list) out.push(`</${list}>`);
  return `<div class="prose">${out.join("")}</div>`;
}
function linkTo(base, rel) {
  const st = [];
  for (const p of (base + "/" + rel).split("/")) { if (p === "..") st.pop(); else if (p && p !== ".") st.push(p); }
  return DATA.repo ? `${DATA.repo}/blob/main/${st.join("/")}` : `../${st.join("/")}`;
}
let mermaidReady = null;
function loadMermaid() {
  return mermaidReady ||= new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
    s.onload = () => { mermaid.initialize({startOnLoad: false, securityLevel: "strict", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "neutral"}); res(); };
    s.onerror = rej; document.head.appendChild(s);
  });
}

let lastFocus = null;
async function openDetail(id) {
  const w = byId[id]; if (!w) return;
  const t = T(), el = document.getElementById("sheet");
  if (!el.classList.contains("on")) lastFocus = document.activeElement;
  const altName = lang === "zh-CN" && w.nameZh ? w.name : "";
  const repoFile = DATA.repo ? `${DATA.repo}/blob/main/${w.path}/README.md` : `../${w.path}/README.md`;
  el.setAttribute("aria-label", nameOf(w));
  el.innerHTML = `<div class="sheet-head"><div class="crumb"><span>${esc(lab("kingdoms", w.kingdom))} › ${esc(lab("phyla", w.phylum))} › ${esc(lab("classes", w.class))} · ${w.id}</span><button class="close" aria-label="${t.close}">×</button></div>
    <nav><a href="#d-route">${t.nav.route}</a><a href="#d-steps">${t.nav.steps}</a><a href="#d-runs">${t.nav.runs}</a><a href="#d-sources">${t.nav.sources}</a><a href="#d-diagram">${t.nav.diagram}</a></nav></div>
  <div class="sheet-in">
    <h1>${esc(nameOf(w))}</h1>${altName ? `<div class="alt-name" lang="en">${esc(altName)}</div>` : ""}
    <p class="lede">${esc(sumOf(w))}</p>
    <div class="facts"><span class="grade ${gc(w.coverage)}" title="${esc(t.covLong[w.coverage] || "")}">${esc(t.cov[w.coverage] || "")}, ${t.runs(w.runs)}</span><span class="stop-text">${t.stops(stopsOf(w))}</span></div>
    <div class="actions">${w.kit ? `<a class="btn primary" href="${linkTo(w.path, "variants/claude-code.md")}" target="_blank" rel="noopener">${t.runKit}</a>` : ""}<a class="btn" href="w/${w.id}/${lang === "zh-CN" ? "zh/" : ""}">${t.page}</a><button class="btn" data-copy>${t.share}</button><a class="btn" href="${repoFile}" target="_blank" rel="noopener">${t.source}</a></div>
    <h2 id="d-route">${t.routeTitle}</h2>
    <div class="route-box">${routeHTML(w, true)}<ol class="route-labels">${w.route.map(m => `<li class="${m.k === "stop" ? "stop" : ""}">${m.k === "stop" ? "🛑 " + esc(t.cp[m.cp]) + (m.t && m.t !== m.cp ? `<span style="font-weight:400">: ${esc(m.t)}</span>` : "") : esc(m.t)}</li>`).join("")}</ol></div>
    <dl class="meta-grid"><div><dt>${t.meta.delivers}</dt><dd>${esc(w.deliverable)}</dd></div><div><dt>${t.meta.autonomy}</dt><dd>${esc(t.auto[w.autonomy])}</dd></div><div><dt>${t.meta.pattern}</dt><dd>${w.patterns.map(p => esc(t.pat[p] || p)).join(", ")}</dd></div><div><dt>${t.meta.evidence}</dt><dd>${esc(t.ev[w.evidence])}</dd></div><div><dt>${t.meta.risk}</dt><dd>${esc(t.risk[w.risk] || "")}</dd></div><div><dt>${t.meta.verified}</dt><dd>${esc(w.lastVerified)}</dd></div>${w.variants.length ? `<div style="grid-column:1/-1"><dt>${t.meta.tools}</dt><dd>${w.variants.map(v => `<code>${esc(v)}</code>`).join(" ")}</dd></div>` : ""}</dl>
    ${t.contentNote ? `<p class="note" style="margin-top:22px">${t.contentNote}</p>` : ""}
    <h2 id="d-steps">${t.stepsTitle}</h2><div lang="en">${md(w.steps, w.path)}${w.intro ? `<div style="margin-top:14px">${md(w.intro, w.path)}</div>` : ""}</div>
    <h2 id="d-runs">${t.runsTitle}</h2><div lang="en">${md(w.publicRuns, w.path)}</div>
    <h2 id="d-sources">${t.sourcesTitle}</h2><div lang="en">${md(w.sources, w.path, true)}</div>
    <h2 id="d-diagram">${t.diagramTitle}</h2><div class="shape-line">${esc(w.shape)}</div><div class="diagram" id="dg" style="margin-top:12px"></div>
  </div>`;
  el.classList.add("on"); el.setAttribute("aria-hidden", "false"); document.getElementById("scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  el.scrollTop = 0; el.querySelector(".close").focus();
  el.querySelector(".close").onclick = closeDetail;
  el.querySelector("[data-copy]").onclick = e => { const u = new URL(`w/${w.id}/`, location.href).href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => e.target.textContent = t.copied, () => prompt(t.share, u)); };
  el.querySelectorAll(".sheet-head nav a").forEach(a => a.onclick = ev => { ev.preventDefault(); el.querySelector(a.getAttribute("href")).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start"}); });
  if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
  try { await loadMermaid(); const {svg} = await mermaid.render("m" + id.replace(/\W/g, "") + Date.now(), w.mermaid); const dg = document.getElementById("dg"); if (dg) dg.innerHTML = svg; }
  catch (e) { const dg = document.getElementById("dg"); if (dg) dg.innerHTML = `<pre class="shape-line" style="white-space:pre-wrap;margin:0">${esc(w.mermaid)}</pre>`; }
}
function closeDetail() {
  const el = document.getElementById("sheet");
  if (!el.classList.contains("on")) return;
  el.classList.remove("on"); el.setAttribute("aria-hidden", "true"); document.getElementById("scrim").classList.remove("on");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}

document.addEventListener("click", e => {
  const id = e.target.closest("[data-id]"); if (id) return openDetail(id.dataset.id);
  const v = e.target.closest("[data-view]"); if (v) { state.view = v.dataset.view; return render(); }
  const l = e.target.closest("[data-lang]");
  if (l) {
    lang = l.dataset.lang; try { localStorage.setItem("awa-lang", lang); } catch (x) {}
    const open = document.getElementById("sheet").classList.contains("on") && location.hash.slice(1);
    render(); if (open) openDetail(open); return;
  }
  if (e.target.closest("[data-clear]")) { GROUPS.forEach(g => state.f[g.key].clear()); state.q = ""; document.getElementById("q").value = ""; return render(); }
});
document.addEventListener("change", e => {
  const i = e.target.closest("input[data-g]"); if (!i) return;
  const s = state.f[i.dataset.g]; i.checked ? s.add(i.value) : s.delete(i.value);
  state.open[i.dataset.g] = true; render();
});
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-g]")) state.open[e.target.dataset.g] = e.target.open; }, true);
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; if (state.q && state.view === "start") state.view = "list"; render(); });
document.getElementById("scrim").onclick = closeDetail;
document.getElementById("filters-toggle").onclick = e => { const f = document.getElementById("filters"); f.classList.toggle("on"); e.currentTarget.setAttribute("aria-expanded", String(f.classList.contains("on"))); };
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDetail();
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
});
render();
if (location.hash.length > 1) openDetail(decodeURIComponent(location.hash.slice(1)));
</script>
