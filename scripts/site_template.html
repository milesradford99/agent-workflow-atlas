/*__CSS__*/
/* --- app layout --- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--paper) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--rule); }

.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; font: 600 16px/1 var(--f-head); letter-spacing: -0.01em; white-space: nowrap; }
.brand svg { flex: none; }
.search { position: relative; max-width: 560px; width: 100%; justify-self: center; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--faint); pointer-events: none; }
.search input { width: 100%; font: inherit; font-size: 15px; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 12px; padding: 9px 44px 9px 38px; box-shadow: var(--shadow); }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: none; border-color: var(--route); box-shadow: 0 0 0 4px var(--route-soft); }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 12px var(--f-mono); color: var(--slate); border: 1px solid var(--rule); border-radius: 6px; padding: 1px 7px; background: var(--paper); }
.right { display: flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border-radius: 11px; padding: 3px; background: var(--wash); }
.seg button { border: 0; background: transparent; padding: 6px 13px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; color: var(--slate); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--sheet); color: var(--ink); box-shadow: var(--shadow); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }

.hero { padding: 56px 0 36px; }
.hero h1 { font-size: clamp(34px, 5.4vw, 64px); margin: 0 0 18px; max-width: 17ch; letter-spacing: -0.04em; line-height: 1.04; }

.hero > p { margin: 0; color: var(--slate); font-size: 19px; line-height: 1.55; max-width: 60ch; }

.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 8px 26px; margin: 34px 0 0; padding: 14px 0 0; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--slate); }
.legend li { display: inline-flex; align-items: center; gap: 9px; }
.legend li:first-child { color: var(--ink); font-weight: 500; }
.legend .route { display: inline-flex; width: 14px; justify-content: center; }
.legend .route::before { display: none; }
.legend .route .m { justify-content: center; }

.views { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 0; flex-wrap: wrap; }
.views-r { display: flex; gap: 12px; align-items: center; }
.views .count { color: var(--slate); font-size: 14px; font-variant-numeric: tabular-nums; }
.body { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 44px; padding: 10px 0 80px; }

#filters-toggle[hidden] { display: none !important; }

.filters { position: sticky; top: 78px; align-self: start; max-height: calc(100vh - 96px); overflow: auto; padding-right: 8px; font-size: 14px; scrollbar-width: thin; }
.filters details { border-bottom: 1px solid var(--rule); padding: 12px 0; }
.filters details:first-child { padding-top: 0; }
.filters summary { cursor: pointer; font-weight: 600; font-size: 13.5px; list-style: none; display: flex; justify-content: space-between; align-items: center; }
.filters summary::-webkit-details-marker { display: none; }
.filters summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--slate); border-bottom: 1.5px solid var(--slate); transform: rotate(-45deg); transition: transform .15s; margin-right: 3px; }
.filters details[open] summary::after { transform: rotate(45deg); }
.filters details[open] summary { margin-bottom: 6px; }
.filters label { display: flex; align-items: center; gap: 10px; padding: 4px 6px; margin: 0 -6px; border-radius: 7px; cursor: pointer; color: var(--ink); }
.filters label:hover { background: var(--wash); }
.filters label .n { margin-left: auto; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; }

.filters .hint { color: var(--slate); font-size: 12.5px; margin: 0 0 6px; }
.clear { margin-top: 16px; }

.sec { margin: 0 0 64px; }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; margin: 0 0 20px; flex-wrap: wrap; }
.sec-head h2 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.03em; }
.sec-head p { margin: 0; color: var(--slate); font-size: 15.5px; max-width: 68ch; }

.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; text-align: left; text-decoration: none; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s, border-color .18s; cursor: pointer; }
.field:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); border-color: var(--faint); }
.field-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.field h3 { margin: 0; font-size: 18px; }
.field-n { font: 600 22px/1 var(--f-head); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.field p { margin: 0; color: var(--slate); font-size: 14px; line-height: 1.5; }
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: auto; padding-top: 0; }
.field .bar { margin-top: 12px; }

.bar .g-Strong { background: var(--g-strong); } .bar .g-Partial { background: var(--g-partial); } .bar .g-Weak { background: var(--g-weak); } .bar .g-None { background: var(--faint); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
.card { text-align: left; text-decoration: none; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 20px 22px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s, border-color .18s; }
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-up); border-color: var(--faint); }

.card h3 { margin: 2px 0 0; font-size: 19px; }
.card .sum { margin: 0 0 6px; font-size: 15px; line-height: 1.55; color: var(--slate); }
.card .route { margin: auto 0 0; padding: 8px 0 12px; }
.card .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; border-top: 1px solid var(--rule); padding-top: 12px; }

.map-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; margin-bottom: 28px; }
.jump { display: flex; flex-wrap: wrap; gap: 8px; }

.ev-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--slate); }

.kingdom { margin: 0 0 52px; scroll-margin-top: 84px; }
.kingdom > header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.kingdom h2 { margin: 0; font-size: 26px; letter-spacing: -0.03em; }
.kingdom > header span { color: var(--slate); font-size: 14px; }
.phyla { columns: 2 380px; column-gap: 16px; }
.phylum { break-inside: avoid; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 18px 20px 12px; margin: 0 0 16px; box-shadow: var(--shadow); }

.wf { display: grid; grid-template-columns: 8px minmax(0, 1fr) 64px; gap: 12px; align-items: center; text-decoration: none; color: var(--ink); padding: 7px 8px; margin: 0 -8px; border-radius: 9px; }
.wf:hover { background: var(--wash); }

.rows { background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
.row, .row-head { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(0, 1.1fr) 130px 104px; gap: 20px; align-items: center; padding: 16px 20px; }
.row-head { padding-top: 11px; padding-bottom: 11px; font-size: 12.5px; color: var(--slate); background: var(--wash); border-bottom: 1px solid var(--rule); }

.empty { padding: 70px 0; text-align: center; color: var(--slate); }

.scrim { position: fixed; inset: 0; background: rgba(8, 10, 14, .38); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .2s; }

.sheet-head { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--rule); padding: 12px 40px 0; }
.sheet-head .crumb { display: flex; justify-content: space-between; gap: 12px; align-items: center; }

.sheet-head nav a { color: var(--slate); text-decoration: none; white-space: nowrap; padding: 6px 0 10px; border-bottom: 2px solid transparent; }

.sheet-in { padding: 36px 40px 90px; }

#filters-toggle[hidden] { display: none !important; }

  .filters.on { display: block; }
  #filters-toggle { display: inline-flex; }

  .fields { grid-template-columns: repeat(2, minmax(0, 1fr)); }

}
@media (max-width: 680px) {

  .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .wrap { padding: 0 16px; }

  .stats { gap: 14px 28px; } .stats dd { font-size: 28px; }
  .sheet-head { padding-left: 18px; padding-right: 18px; } .sheet-in { padding: 24px 18px 70px; }
  .cards, .fields { grid-template-columns: 1fr; }
  .phyla { columns: 1; }
  .sec-head h2, .kingdom h2 { font-size: 22px; }

}

    <section class="d-sec"><h2 id="d-route">${t.routeTitle}</h2>
    <div class="route-box">${flowHTML(w)}</div>
    <dl class="meta-grid"><div><dt>${t.meta.delivers}</dt><dd>${esc(w.deliverable)}</dd></div><div><dt>${t.meta.autonomy}</dt><dd>${esc(t.auto[w.autonomy])}</dd></div><div><dt>${t.meta.pattern}</dt><dd>${w.patterns.map(p => esc(t.pat[p] || p)).join(", ")}</dd></div><div><dt>${t.meta.evidence}</dt><dd>${esc(t.ev[w.evidence])}</dd></div><div><dt>${t.meta.risk}</dt><dd>${esc(t.risk[w.risk] || "")}</dd></div><div><dt>${t.meta.verified}</dt><dd>${esc(w.lastVerified)}</dd></div>${w.variants.length ? `<div class="wide"><dt>${t.meta.tools}</dt><dd>${w.variants.map(v => `<code>${esc(v)}</code>`).join(" ")}</dd></div>` : ""}</dl></section>
    ${t.contentNote ? `<p class="note" style="margin-top:28px">${t.contentNote}</p>` : ""}
    ${sec("d-setup", t.setupTitle, w.introHtml, ' lang="en"')}
    ${sec("d-steps", t.stepsTitle, w.stepsHtml, ' lang="en"')}
    ${sec("d-runs", t.runsTitle, w.runsHtml, ' lang="en"')}
    ${sec("d-sources", t.sourcesTitle, w.sourcesHtml, ' lang="en"')}
    <section class="d-sec"><h2 id="d-diagram">${t.diagramTitle}</h2><div class="shape-line">${esc(w.shape)}</div><div class="diagram" id="dg" style="margin-top:12px"></div></section>
  </div>`;
  el.classList.add("on"); el.setAttribute("aria-hidden", "false"); document.getElementById("scrim").classList.add("on");
  document.body.style.overflow = "hidden";
  el.scrollTop = 0; el.querySelector(".close").focus();
  el.querySelector(".close").onclick = closeDetail;
  el.querySelector("[data-copy]").onclick = e => { const u = new URL(`w/${w.id}/`, location.href).href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => e.target.textContent = t.copied, () => prompt(t.share, u)); };
  // in-sheet anchors (section nav, citations) scroll the sheet; the page hash stays the workflow id
  el.querySelectorAll('a[href^="#"]').forEach(a => a.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); const to = el.querySelector(`[id="${a.getAttribute("href").slice(1)}"]`); if (to) to.scrollIntoView({behavior: calm(), block: "start"}); });
  if (location.hash !== "#" + id) history.replaceState(null, "", location.pathname + location.search + "#" + id);
  drawDiagram(w);
}
function closeDetail() {
  const el = document.getElementById("sheet");
  if (!el.classList.contains("on")) return;
  el.classList.remove("on"); el.setAttribute("aria-hidden", "true"); document.getElementById("scrim").classList.remove("on");
  document.body.style.overflow = "";
  history.replaceState(null, "", location.pathname + location.search);
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
const openId = () => document.getElementById("sheet").classList.contains("on") && location.hash.slice(1);

document.addEventListener("click", e => {
  const id = e.target.closest("[data-id]");
  if (id) { if (e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); return openDetail(id.dataset.id); }
  const j = e.target.closest("[data-jump]"); if (j) { e.preventDefault(); return setView("map", j.dataset.jump); }
  const v = e.target.closest("[data-view]"); if (v) return setView(v.dataset.view);
  const l = e.target.closest("[data-lang]");
  if (l) {
    lang = l.dataset.lang; try { localStorage.setItem("awa-lang", lang); } catch (x) {}
    const open = openId();
    render(); if (open) openDetail(open); return;
  }
  if (e.target.closest("[data-best]")) { GROUPS.forEach(g => state.f[g.key].clear()); state.f.coverage.add("Strong"); return setView("list"); }
  if (e.target.closest("[data-clear]")) { GROUPS.forEach(g => state.f[g.key].clear()); state.q = ""; document.getElementById("q").value = ""; return render(); }
});
document.addEventListener("change", e => {
  const i = e.target.closest("input[data-g]"); if (!i) return;
  const s = state.f[i.dataset.g]; i.checked ? s.add(i.value) : s.delete(i.value);
  state.open[i.dataset.g] = true; render();
});
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-g]")) state.open[e.target.dataset.g] = e.target.open; }, true);
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value; if (state.q && state.view === "start") state.view = "list"; render(); });
document.getElementById("scrim").onclick = closeDetail;
document.getElementById("filters-toggle").onclick = e => { const f = document.getElementById("filters"); f.classList.toggle("on"); e.currentTarget.setAttribute("aria-expanded", String(f.classList.contains("on"))); };
document.getElementById("theme").onclick = () => {
  document.documentElement.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("awa-theme", document.documentElement.dataset.theme); } catch (x) {}
  const open = openId(); if (open) drawDiagram(byId[open]);
};
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeDetail();
  if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); document.getElementById("q").focus(); }
});
render();
if (location.hash.length > 1) openDetail(decodeURIComponent(location.hash.slice(1)));
</script>
</body>
</html>
